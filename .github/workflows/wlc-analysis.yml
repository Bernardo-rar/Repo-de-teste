name: WLC Analysis

on:
  push:
    branches: [main]

env:
  WLC_PORTAL_URL: https://api.hml.weluvcode.ai/api
  WLC_REPOSITORY_ID: "114"

jobs:
  trigger-wlc:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger WLC Analysis
        id: trigger
        run: |
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            "$WLC_PORTAL_URL/webhooks/push-analysis" \
            -H "Authorization: Bearer ${{ secrets.WLC_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repository_id\": $WLC_REPOSITORY_ID,
              \"branch\": \"${{ github.ref_name }}\",
              \"commit_sha\": \"${{ github.sha }}\"
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          case "$HTTP_CODE" in
            202)
              echo "::notice::WLC analysis dispatched (HTTP 202 — repo monitored)"
              ;;
            422)
              echo "::warning::WLC repo paused — analysis NOT dispatched (HTTP 422). Expected when monitoring is off."
              ;;
            500)
              echo "::warning::Portal accepted (auth OK) but downstream dispatch failed (HTTP 500). Acceptable for #750 gating test on unprovisioned repo."
              ;;
            *)
              echo "::error::Unexpected HTTP $HTTP_CODE: $BODY"
              exit 1
              ;;
          esac

      - name: Summary
        run: |
          {
            echo "### WLC Analysis Webhook"
            echo "- HTTP code: ${{ steps.trigger.outputs.http_code }}"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
